<!-- ritl-bk 2.7 · 20.11.2026 · DEV – einheitliches Backup der RIEMER Tools (Regel S-17, Rollout R-13). Vorbild MUSTER.ritl V3.9.
     Einbau: Adapter window.RITL_BK (siehe README.md) als <script> setzen, danach diesen Block unverändert (von ritl-bk:start bis ritl-bk:end) in den <body> nach dem Header kopieren.
     2.1 ist rückwärtskompatibel: neue Angaben (bereit, ohneSha, norm, nachAnwenden, fluechtig, extra, alias, alt.idbFs*) sind optional.
     2.3: Pfad des verknüpften Ordners (✎ je Gerät). 2.4: Stufe je Datenquelle (Lizenz-Matrix backup.max.matrix, z. B. A3 · B2 · C1) – ohne Matrix wie 2.2.
     2.5: „Backup einrichten“ als Raster Datenquelle × Stufe (A1 … C3), jede Kombination einzeln erlaubt oder gesperrt.
     2.6: Stufe je Datenquelle einzeln wählbar und gemerkt (cfg_set stufen), Spalte „aktiv“ wählt die Datenquelle.
     2.7: alle angebotenen Datenquellen gleichzeitig aktiv, jede in ihrer Stufe (z. B. A3 + B2 + C1) – keine Spalte „aktiv“ mehr. -->

 // 2.1: ein leerer Stand (A.leer) ersetzt nie einen vorhandenen Stand der Historie

 try{const gz=await gzip(JSON.stringify(o));const j=await zbApi('save',{stufe:st,b64:b64(gz),sha256:h,raw:dat.length,version:ver()});ZB.lastSha[st]=h;ZB.last=new Date();ZB.err='';if(force)toast(j.unchanged?'Zentral: keine Änderung seit dem letzten Stand':`Zentral gesichert (${st} · ${fmtB(gz.length)})`);if($('bkdlg').open)zbList()}

async function shaBlob(b){const x=await crypto.subtle.digest('SHA-256',await b.arrayBuffer());return [...new Uint8Array(x)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function fsigLocal(){if(!syFilesOn())return '';const l=await RF.list();return l.map(f=>f.id+':'+f.size+':'+f.name).sort().join('|')}
// 2.1: Dateien nach Prüfsumme (sha256 aus files_list) vergleichen; ältere Server ohne sha256 → wie 2.0 nach Größe und Name
const FSHA=new Map();
async function locSha(f){const k=f.size+'|'+f.name+'|'+(f.at||''),c=FSHA.get(f.id);if(c&&c[0]===k)return c[1];const r=await RF.get(f.id).catch(()=>null);if(!r||!r.blob)return '';const h=await shaBlob(r.blob);FSHA.set(f.id,[k,h]);return h}
const gleich=async(s,l)=>s.sha256?s.name===l.name&&s.sha256===await locSha(l):s.bytes===l.size&&s.name===l.name;
async function filesUp(){const srv=(await okj('files_list')).items||[],sm=new Map(srv.map(x=>[x.file_id,x])),loc=await RF.list();
 for(const f of loc){const s=sm.get(f.id);if(s&&await gleich(s,f))continue;
  const r=await RF.get(f.id);if(!r)continue;const hh=await shaBlob(r.blob);FSHA.set(f.id,[f.size+'|'+f.name+'|'+(f.at||''),hh]);
  const p=await okj('files_put',{file_id:f.id,name:f.name,mime:f.type,bytes:f.size,sha256:hh,ref:f.ref||''});
  const fd=new FormData();fd.append('cacheControl','3600');fd.append('',r.blob,f.name);
  const u=await fetch(p.url,{method:'PUT',headers:{'x-upsert':'true'},body:fd}).catch(()=>null);
  if(!u||!u.ok)throw new Error(`Datei „${f.name}“ konnte nicht hochgeladen werden`);
  await okj('files_done',{file_id:f.id})}
 return srv.filter(s=>!loc.some(f=>f.id===s.file_id))}
async function filesDown(){const srv=(await okj('files_list')).items||[],loc=await RF.list(),lm=new Map(loc.map(f=>[f.id,f]));
 for(const s of srv){const l=lm.get(s.file_id);if(l&&await gleich(s,l))continue;
  const g=await okj('files_get',{file_id:s.file_id});const r=await fetch(g.url).catch(()=>null);if(!r||!r.ok)throw new Error(`Datei „${s.name}“ konnte nicht geladen werden`);
  const b=await r.blob();await RF.put(new Blob([b],{type:s.mime||b.type}),{id:s.file_id,name:s.name,ref:s.ref||''})}
 for(const l of loc)if(!srv.some(s=>s.file_id===l.id))await RF.del(l.id)}

async function syApply(j,st){const o=JSON.parse(await gunzip(unb64(j.b64))),q=`Server · ${st} · Stand ${j.rev}`;await restore(check(o,'backup'),q,true,'server',true);const ls=LAST_ST;if(syFilesOn())await filesDown();
 const L=await syLocal();SY={...SY,stufe:st,rev:j.rev,sha:L.h,at:j.at,err:'',l:leer()};sySave();ZB.last=new Date();await applied(ls,'server',q,true)}
async function syPull(start){if(!syOn()||SY.busy)return;if(!RDY)return;if(!navigator.onLine){ZB.pending=true;renderZb();return}
 SY.busy=true;renderZb();let next=null;
 try{const st=syStufe();if(SY.stufe!==st)SY={...SY,stufe:st,rev:0,sha:''};
  const neu=!SY.rev&&!SY.sha&&leer(); // neues Gerät ohne eigene Daten übernimmt still
  const j=await syRaw('state_get',{stufe:st});if(!j.ok)throw new Error(errTxt(j.error));
  const L=await syLocal(),dirty=L.h!==SY.sha;SY.err='';
  if(j.empty)next=()=>syPush(false);
  else if(j.sha256===L.h){SY={...SY,rev:j.rev,sha:L.h,at:j.at,l:leer()};sySave()}
  else if(j.rev===SY.rev){if(dirty)next=()=>syPush(false)}
  else if(!dirty||neu){await syApply(j,st);if(!start)toast('Neuer Stand vom Server geladen')}
  else{SY.conflict=j;next=syConflict}}
 catch(e){SY.err=e.message}finally{SY.busy=false;renderZb()}if(next)return next()}
async function syPush(force){if(!syOn()||SY.busy)return;if(!RDY)return;if(!navigator.onLine){ZB.pending=true;renderZb();return}

 if(!force&&SY.rev&&SY.l===false&&SY.stufe===syStufe()&&syStufe()!=='settings'&&leer())return;
 // 2.1: Fehler aus settings()/daten() abfangen
 ZB.pending=false;let L;try{L=await syLocal()}catch(e){return}if(SY.stufe!==L.st)SY={...SY,stufe:L.st,rev:0,sha:''};if(!force&&L.h===SY.sha)return;
 SY.busy=true;renderZb();let next=null;
 try{const weg=syFilesOn()?await filesUp():[];const gz=await gzip(JSON.stringify(L.o));const j=await syRaw('state_put',{stufe:L.st,b64:b64(gz),sha256:L.h,raw:L.dat.length,version:ver(),base_rev:SY.rev,force:!!force});
  if(j.ok){SY={...SY,rev:j.rev,sha:L.h,at:j.at||new Date().toISOString(),err:'',l:leer()};sySave();ZB.last=new Date();ZB.lastSha[L.st]=L.h;ZB.err='';for(const s of weg)await syRaw('files_del',{file_id:s.file_id}).catch(()=>{});if(force)toast(j.unchanged?'Server: keine Änderung':`Am Server gespeichert (Stand ${j.rev})`)}
  else if(j.error==='conflict'){const g=await syRaw('state_get',{stufe:L.st});if(g.ok&&!g.empty){if(!force&&leer())next=()=>syLeerApply(g,L.st);else{SY.conflict=g;next=syConflict}}}
  else throw new Error(errTxt(j.error))}
 catch(e){SY.err=e.message}finally{SY.busy=false;renderZb()}if(next)return next()}

   <p class="bkinfo">Aktiv: <b class="notr">${DQ.filter(d=>!why(d)).map(d=>kurz(d,SELS[d])).join(' + ')}</b> – ${DQ.filter(d=>!why(d)).length>1?'alle Datenquellen gleichzeitig, jede in ihrer Stufe: ':''}${DQ.filter(d=>!why(d)).map(d=>`${DQL[d][0]}: ${dqW(d,SELS[d])}`).join(' · ')}.</p>`;
 const top=lic?`<div class="status${LIC&&LIC.wahl?' good':''}" style="margin-bottom:12px">Lizenz: höchstens <b class="notr">${mx?esc(mxKurz()):'–'}</b>${mx&&!m?` (${esc(dqTxt(mx.datenquelle))} · Stufe ${esc(stTxt(mx.stufe))})`:''} · Kontingent ${quotaTxt()}${eff?` · wirksam <b class="notr">${eff}</b>`:''}${LIC&&LIC.wahl?` – gewählt für ${esc(NAME)}, gilt auf allen Geräten.`:' – noch keine eigene Wahl, es gilt das Maximum.'}${LIC&&LIC.wahl?' <button class="btn ghost" type="button" id="bks-reset" style="padding:2px 8px;font-size:12px">Vorgabe der Lizenz verwenden</button>':''}</div>`
  :`<div class="status${OFFLINE||pv?' warn':''}" style="margin-bottom:12px">${OFFLINE?'Offline-Version: nur A · Lokal – zentrale Funktionen entfallen.':pv?PVTXT+'. Zum Testen das Tool mit einer Lizenz öffnen (Kanal Dev).':'Ohne Lizenz: nur A · Lokal. B · Ordner und C · Server gibt es in der lizenzierten Version (Aufruf über die RIEMER Toolbox).'}</div>`;
 const ob=lic&&!why('ordner');
 return `${top}<p class="small" style="margin:0">Wählen Sie, wo die Daten von ${esc(NAME)} liegen und wie umfangreich gesichert wird. Größen komprimiert, so wie gespeichert.${lic?' Die Wahl gilt für alle Geräte dieses Tools.':''} Später jederzeit unter <b>Backup</b> änderbar.</p>
  <section class="iosec" style="margin-top:14px"><h3><i>01</i>Datenquellen · Stufe je Datenquelle</h3><p class="small" style="margin:6px 0 0">Alle Datenquellen sind gleichzeitig aktiv. Je Zeile wählen, welche Daten dort liegen.</p>${grid}</section>
  <section class="iosec"><h3><i>02</i>Ordner · OneDrive &amp; SharePoint<small>dieses Gerät</small></h3>
   <label class="iochk"><input type="checkbox" id="bks-lon"${CFG.lokal.on||ob?' checked':''}${!fsSupported()||ob?' disabled':''}><span>Nach jeder Änderung in den verknüpften Ordner sichern (<code class="notr">${esc(BKNAME)}</code>, wird überschrieben)${ob?' <span class="lk">· bei B immer – der Ordner ist die Datenbank</span>':''}</span></label>
   <div class="status${FS.handle?' good':ob?' warn':''}" style="margin-top:10px">${!fsSupported()?(ob?'Dieser Browser kann keinen Ordner verknüpfen – B · Ordner geht nur in Chrome oder Edge am Computer.':'Dieser Browser kann keinen Ordner verknüpfen – „Backup speichern“ legt die Datei im Download-Ordner ab.'):FS.handle?`Ordner „${esc(FS.handle.name)}“ verknüpft`:ob?'Noch kein Ordner verknüpft – für B · Ordner bitte auf diesem Gerät einmal verknüpfen.':'Noch kein Ordner verknüpft.'}</div>
   ${fsSupported()?`<div class="iorow"><button class="btn" type="button" id="bks-link">${FS.handle?'Anderer Ordner …':'Ordner verknüpfen …'}</button></div>`:''}</section>
  ${OFFLINE?'':`<p class="small" style="margin:12px 0 0">${pv?PVTXT+'.':!lic?'Zentrales Backup nur in der lizenzierten Version (Aufruf über die RIEMER Toolbox).':`Zentral mit Historie bis ca. ${sz?fmtB(sz[SEL.st==='storage'?'datenbank':SEL.st].gz*11):'–'} (höchstens 11 Stände, nur geänderte werden gespeichert). Kontingent ${quotaTxt()} je Lizenz für alle Tools. Gespeichert in der EU (Frankfurt), Zugriff nur mit Ihrem Lizenzschlüssel.`}</p>`}`}
function renderSetup(){const b=$('bks-body');b.innerHTML=setupHtml();
 b.querySelectorAll('input[type=radio][name^="bks-st-"]').forEach(r=>r.onchange=()=>{SELS[r.name.slice(7)]=r.value;SEL.st=SELS[SEL.dq];const keep=$('bks-lon')&&$('bks-lon').checked;renderSetup();const l=$('bks-lon');if(l&&!l.disabled)l.checked=keep});
 const lk=$('bks-link');if(lk)lk.onclick=async()=>{const keep=$('bks-lon')&&$('bks-lon').checked;await link();renderSetup();const l=$('bks-lon');if(l&&!l.disabled)l.checked=keep||!!FS.handle};
 const rs=$('bks-reset');if(rs)rs.onclick=async()=>{try{const j=await okj('cfg_set',{reset:true});setLic(j.backup);await srvCheck();selInit();renderSetup();renderZb();renderLokalStufe();toast(`Vorgabe der Lizenz gilt wieder: ${kurz(SEL.dq,SEL.st)}`);startSync()}catch(e){toast('Backup einrichten: '+e.message)}}}
async function openSetup(){const d=$('bksetup');SZ=await sizes().catch(()=>null);if(zbOk())await srvCheck();
 selInit();
 if($('bkdlg').open)$('bkdlg').close();renderSetup();if(!d.open)d.showModal()}
function startSync(){if(ORD()){if(FS.handle)oqPull(false);else oqStart()}if(CFG.zentral.on)(syOn()?syPull(true):zbSave(true))}
$('bks-ok').onclick=async()=>{if(zbOk()&&$('bks-body').querySelector('input[name^="bks-st-"]:checked:disabled')){toast('Eine gewählte Stufe ist durch die Lizenz nicht erlaubt – bitte eine freie Stufe wählen.');return}const lonEl=$('bks-lon'),lon=!!(lonEl&&lonEl.checked&&!lonEl.disabled);
 if(!zbOk()){CFG.lokal={on:lon,stufe:SEL.st};CFG.seen=true;cfgSave();FS.auto=lon&&!!FS.handle;fsCfg();renderFs();renderZb();renderLokalStufe();$('bksetup').close();
  if(FS.auto)fire();toast('Backup eingerichtet: '+(lon?`lokal in den Ordner (${SEL.st})`:`A · Lokal (${SEL.st}) – Backup manuell`));return}
 const ok=$('bks-ok');ok.disabled=true;const vorher=effKurz();
 try{const m=LIC&&LIC.matrix,stufen={};DQ.forEach(d=>{if(!m||m[d])stufen[d]=SELS[d]});const top=DQ.filter(d=>stufen[d]).pop()||'lokal';
  const j=await okj('cfg_set',{datenquelle:top,stufe:stufen[top],stufen});setLic(j.backup);
  if(j.backup){SRV.mode=j.backup.datenquelle;SRV.stufe=j.backup.stufe;LSset(K('srv'),SRV.mode);LSset(K('srvst'),SRV.stufe)}
  if(!ORD())CFG.lokal.on=lon;applyEff();await srvCheck()}
 catch(e){ok.disabled=false;toast('Backup einrichten: '+e.message);return}
 ok.disabled=false;FS.auto=CFG.lokal.on&&!!FS.handle&&!ORD();fsCfg();renderFs();renderZb();renderLokalStufe();$('bksetup').close();
 const k=effKurz();toast(`Backup eingerichtet: ${k}${ALLE()?' – alle Datenquellen aktiv':''}, gilt auf allen Geräten`);
 startSync();if(!ORD()&&FS.auto)fire()};
$('bks-later').onclick=()=>{CFG.seen=true;cfgSave();$('bksetup').close()};
$('bk-setup').onclick=()=>{$('bkdlg').close();openSetup()};

// ── Start ──
if(OFFLINE){CFG.zentral.on=false;CFG.zentral.quelle=false;$('zb-sec').hidden=true}
if(zbOk()&&(SRV.mode||ALLE()))applyEff(); // aus dem Cache, bis state_head antwortet
renderFs();bkInd();
// mit Lizenz gelten die wirksamen Werte (Wahl ≤ Maximum) ohne Rückfrage; „Backup einrichten“ öffnet sich nur, wenn der Server nichts vorgibt
// (ältere Server) und noch nichts eingerichtet ist, oder bei B ohne Ordner auf diesem Gerät
// 2.1: erster Abgleich bzw. zentrales Sichern erst, wenn das Tool bereit ist (A.bereit)
const start=()=>{if(ORD())oqStart();if(CFG.zentral.on)syOn()?syPull(true):zbSave(false)};
if(zbOk())setTimeout(()=>srvCheck().then(()=>{renderZb();if(!SRV.mode&&!CFG.seen)return openSetup();RDY?start():BEREIT.then(start)}),!CFG.seen||CFG.zentral.quelle||SRV.mode==='ordner'||SRV.mode==='server'?300:3000);
else if(!CFG.seen)setTimeout(openSetup,900);

// 2.1: Abgleich auf Knopfdruck – B: Datei im Ordner, C: Server (holen bzw. hochladen), A: zentral sichern; Ergebnis {ok, datenquelle, rev, konflikt, fehler}
const warte=async o=>{for(let i=0;i<150&&o.busy;i++)await new Promise(r=>setTimeout(r,100))};
async function sync(){await BEREIT;await FSREADY;const r={ok:true,datenquelle:zbOk()?SRV.mode||'lokal':'lokal',rev:0,konflikt:false,fehler:''};
 if(!zbOk()){r.ok=false;r.fehler=OFFLINE?'Server: entfällt (Offline-Version)':PREVIEW()?PVTXT:'Server: nicht verfügbar (ohne Lizenz)';return r}
 if(ORD()){if(!FS.handle||!FS.ok){r.ok=false;r.fehler=oqInd()[1]}else{await warte(OQ);await oqPull(false);r.rev=OQ.rev;r.konflikt=!!OQ.conflict;if(OQ.err){r.ok=false;r.fehler=OQ.err}}}
 if(!navigator.onLine){r.ok=false;r.fehler=r.fehler||ZBERR.network;renderZb();return r}
 if(syOn()){await warte(SY);await syPull(false);if(!ORD())r.rev=SY.rev;r.konflikt=r.konflikt||!!SY.conflict;if(SY.err){r.ok=false;r.fehler=r.fehler||SY.err}}
 else if(CFG.zentral.on&&!ORD()){await warte(ZB);await zbSave(false);if(ZB.err){r.ok=false;r.fehler=r.fehler||ZB.err}}
 renderZb();return r}

 open:openBk,setup:openSetup,schedule:()=>fire(),sync,extra:renderExtra,
 fs:{status:fsStatus,buttons:fsButtons,read:fsRead,write:fsWrite,run,action:fsAction,perm:fsPerm,supported:fsSupported,get handle(){return FS.handle},get ok(){return FS.ok}},
 head,check,download,pickFile,restore:(d,quelle,still)=>restore(d,quelle,still,'datei'),zeit,stamp,esc,
 stand:()=>({alle:ALLE(),datenquellen:ALLE()?{...LIC.stufen}:null,datenquelle:zbOk()?SRV.mode||'lokal':'lokal',stufe:zbOk()?SRV.stufe||CFG.lokal.stufe:CFG.lokal.stufe,max:LIC&&LIC.max||null,matrix:LIC&&LIC.matrix||null,stufen:LIC&&LIC.stufen||null,wahl:LIC&&LIC.wahl||null,quota:LIC&&LIC.quota||0,lokal:{...CFG.lokal},zentral:{...CFG.zentral},sync:syOn(),ordner:ORD(),bereit:RDY})};
document.dispatchEvent(new Event('ritlbk:ready'));
