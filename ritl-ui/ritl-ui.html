<!--ritl-ui:start-->
<style id="ritl-ui-css">
/* RITL-UI 1.7 – zentraler Header der RIEMER Tools. Wird vom Lizenzserver beim Ausliefern durch die aktuelle Version ersetzt.
   Maße nach PPTX.ritl (Standard): Header 64 px, App-Bild 38 px, Titel 22 px, Eyebrow 10,5 px, Chips 34 px.
   Rechts immer kompakt: Tool-Knöpfe als eckige Chips nur mit Symbol, System-Knöpfe als runde Chips. Nur Tokens der Farbkarte –
   Ausnahme: Schriftzug „RIEMER Tools“ und Toolbox-Logo bleiben auch bei Lizenz-Farben im RIEMER-Blau (Marke).
   Ab 1.5 ist der Header nicht mehr sticky: Er läuft beim Scrollen aus, das Module-Ribbon des Tools klebt oben (Skill-Regel 28, S-19).
   Ab 1.6 bei Tool-Typ „dokument“ (ritl-doc): Knöpfe Neu · Öffnen … · Speichern · Speichern unter … und Projektname mit „•“ im Titel.
   Ab 1.7 Overlay-Sperre: Solange eine überlagernde Ebene offen ist (dialog[open]:modal oder [data-ritl-overlay] sichtbar),
   scrollt die Seite dahinter nicht – weder Rad noch Touch noch Tastatur. overscroll-behavior:contain nur in Overlays. */
header[data-ritl-header]{position:relative;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--sans,"Inter",system-ui,sans-serif)}
header[data-ritl-header]:not(.ritl-h)>*{visibility:hidden}
.ritl-in{max-width:var(--page-max,2048px);margin:0 auto;height:64px;padding:0 22px;display:flex;align-items:center;gap:20px;box-sizing:border-box}
.ritl-id{display:flex;align-items:center;gap:12px;min-width:0;flex:none}
.ritl-icon{width:38px!important;height:38px!important;flex:none;display:block}
.ritl-tt{min-width:0}
.ritl-eb{margin:0 0 2px;font:600 10.5px/14px var(--sans,"Inter",system-ui,sans-serif);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritl-title{margin:0;display:flex;align-items:center;min-width:0;font:800 22px/1.05 var(--sans,"Inter",system-ui,sans-serif);letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.ritl-title .ritl-nm{overflow:hidden;text-overflow:ellipsis}
.ritl-title .ritl-nm span{color:var(--accent-text)}
.ritl-pill{flex:none;display:inline-block;margin-left:10px;padding:2px 7px;border-radius:var(--radius-sm,3px);font:600 11px/15px var(--mono,"JetBrains Mono",ui-monospace,monospace);letter-spacing:1px;background:var(--brand);color:var(--on-brand,#fff)}
.ritl-pill.std{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.ritl-pill.beta{margin-left:6px;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.ritl-pill.dev{margin-left:6px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.ritl-pill[hidden]{display:none}
.ritl-ver{flex:none;margin-left:10px;font:500 12px/16px var(--mono,"JetBrains Mono",ui-monospace,monospace);letter-spacing:1.5px;color:var(--muted)}
.ritl-mid{flex:1 1 0;min-width:0;display:flex;justify-content:center;overflow:hidden}
.ritl-act{flex:none;display:flex;align-items:center;gap:12px;margin-left:auto}
.ritl-tool,.ritl-sys{display:flex;align-items:center;gap:6px}
.ritl-tool>button,.ritl-tool>a{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-width:34px;padding:0 9px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:600 13px/1 var(--sans,"Inter",system-ui,sans-serif);cursor:pointer;white-space:nowrap;text-decoration:none;box-sizing:border-box;transition:border-color .15s,color .15s}
.ritl-tool>button:hover,.ritl-tool>a:hover{border-color:var(--brand);color:var(--accent-text)}
.ritl-tool>button svg,.ritl-tool>a svg{width:15px;height:15px;flex:none}
.ritl-tool .lbl{display:none}
.ritl-chip{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer;font:700 12px/1 var(--sans,"Inter",system-ui,sans-serif);letter-spacing:.3px;box-sizing:border-box;transition:border-color .15s,color .15s}
.ritl-chip:hover{border-color:var(--brand);color:var(--accent-text)}
.ritl-chip svg{width:15px;height:15px;display:block}
.ritl-chip.q{font-size:15px;font-weight:800}
.ritl-chip:disabled{opacity:.45;cursor:default}
.ritl-tb{flex:none;display:inline-flex;margin-left:4px;line-height:0;border-radius:7px}
.ritl-tb svg{width:30px;height:30px}
.ritl-wm{flex:none;margin-left:2px;font:800 15px/1 var(--sans,"Inter",system-ui,sans-serif);letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.ritl-wm span{color:#1F5FC2}
[data-theme="dark"] .ritl-wm span{color:#6EA2FF}
header[data-ritl-header] :is(button,a):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ritl-pill.off{margin-left:6px;background:var(--warn);color:#fff}
.ritl-eb.off{color:var(--warn)}
.ritl-offnote{margin:0 0 14px;padding:10px 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--surface));color:var(--warn);font:500 13px/1.45 var(--sans,"Inter",system-ui,sans-serif)}
#ritl-expired{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(15,20,28,.72);padding:20px}
#ritl-expired>div{max-width:520px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3);font:400 14px/1.5 var(--sans,"Inter",system-ui,sans-serif)}
#ritl-expired h2{margin:0 0 8px;font:800 19px var(--sans,"Inter",system-ui,sans-serif);color:var(--warn)}
#ritl-expired p{margin:0 0 10px;color:var(--ink2)}
#ritl-expired .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#ritl-expired button,#ritl-expired a{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 13px var(--sans,"Inter",system-ui,sans-serif);cursor:pointer;text-decoration:none}
#ritl-expired .pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand,#fff)}
.ritl-docn{flex:0 1 auto;min-width:0;margin-left:10px;font:600 15px/1.2 var(--sans,"Inter",system-ui,sans-serif);letter-spacing:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw}
.ritl-docn[hidden]{display:none}
.ritl-docn i{font-style:normal;color:var(--warn);margin-left:4px}
.ritl-tool .ritl-docsep{width:1px;height:22px;margin:0 3px;background:var(--line2);flex:none}
/* ── Overlay-Sperre (ab 1.7): JS setzt html[data-ritl-lock] (g = Scrollleiste war da → Platz halten, b = body ist der Scroller) ── */
html[data-ritl-lock]{overflow:hidden!important;overscroll-behavior:none}
html[data-ritl-lock~="g"]{scrollbar-gutter:stable}
html[data-ritl-lock~="b"] body{overflow:hidden!important}
html:has(dialog[open]:modal){overflow:hidden}
[data-ritl-overlay]:not([data-ritl-overlay="aus"]),[data-ritl-overlay]:not([data-ritl-overlay="aus"]) *{overscroll-behavior:contain}
dialog:modal,dialog:modal *{overscroll-behavior:contain}
@media(max-width:1500px){.ritl-mid{display:none}}
@media(max-width:1000px){.ritl-ver{display:none}}
@media(max-width:900px){.ritl-wm{display:none}}
@media(max-width:860px){.ritl-docn{font-size:13px;max-width:34vw}.ritl-in{height:56px;padding:0 16px;gap:12px}.ritl-eb{display:none}.ritl-icon{width:32px!important;height:32px!important}.ritl-id{gap:10px}.ritl-title{font-size:19px}.ritl-act{gap:8px}}
@media(max-width:620px){.ritl-in{height:auto;flex-wrap:wrap;padding:8px 14px;row-gap:8px}.ritl-id{flex:1 1 auto}
 .ritl-act{order:3;width:100%;margin-left:0;justify-content:space-between;flex-wrap:wrap;row-gap:6px}.ritl-tb{margin-left:auto}}
@media(max-width:400px){.ritl-tb{display:none}.ritl-tool,.ritl-sys{gap:4px}}
@media print{header[data-ritl-header]{position:static}.ritl-act{display:none}}
</style>
<script id="ritl-ui-js">
