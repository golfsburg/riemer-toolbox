<!--ritl-ui:start-->
<style id="ritl-ui-css">
/* RITL-UI 1.0 – zentraler Header der RIEMER Tools. Wird vom Lizenzserver beim Ausliefern durch die aktuelle Version ersetzt.
   Nur Tokens der Farbkarte (--brand, --ink, --muted, --line2, --surface …). */
header[data-ritl-header]{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--sans,"Inter",system-ui,sans-serif)}
header[data-ritl-header]:not(.ritl-h)>*{visibility:hidden}
.ritl-in{max-width:var(--page-max,2048px);margin:0 auto;height:80px;padding:0 40px;display:flex;align-items:center;gap:24px;box-sizing:border-box}
.ritl-id{display:flex;align-items:center;gap:16px;min-width:0;flex:none}
.ritl-icon{width:52px!important;height:52px!important;flex:none;display:block}
.ritl-tt{min-width:0}
.ritl-eb{margin:0 0 3px;font:500 12px/16px var(--mono,"JetBrains Mono",ui-monospace,monospace);letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritl-title{margin:0;display:flex;align-items:center;gap:0;min-width:0;font:800 28px/1.05 var(--sans,"Inter",system-ui,sans-serif);letter-spacing:-.6px;color:var(--ink);white-space:nowrap}
.ritl-title .ritl-nm{overflow:hidden;text-overflow:ellipsis}
.ritl-title .ritl-nm span{color:var(--accent-text)}
.ritl-pill{flex:none;display:inline-block;margin-left:10px;padding:3px 8px;border-radius:var(--radius-sm,3px);font:600 11px/15px var(--mono,"JetBrains Mono",ui-monospace,monospace);letter-spacing:1px;background:var(--brand);color:var(--on-brand,#fff)}
.ritl-pill.std{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.ritl-pill.beta{margin-left:6px;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.ritl-pill.dev{margin-left:6px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.ritl-pill[hidden]{display:none}
.ritl-ver{flex:none;margin-left:12px;font:500 12px/16px var(--mono,"JetBrains Mono",ui-monospace,monospace);letter-spacing:1.5px;color:var(--muted)}
.ritl-mid{flex:1 1 0;min-width:0;display:flex;justify-content:center;overflow:hidden}
.ritl-mid:empty{display:block}
.ritl-act{flex:none;display:flex;align-items:center;gap:10px;margin-left:auto}
.ritl-tool{display:flex;align-items:center;gap:8px}
.ritl-tool>button,.ritl-tool>a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);font:600 14px/1 var(--sans,"Inter",system-ui,sans-serif);cursor:pointer;white-space:nowrap;text-decoration:none;box-sizing:border-box;transition:border-color .15s,color .15s}
.ritl-tool>button:hover,.ritl-tool>a:hover{border-color:var(--brand);color:var(--accent-text)}
.ritl-tool>button svg,.ritl-tool>a svg{width:16px;height:16px;flex:none}
.ritl-sys{display:flex;align-items:center;gap:8px;padding-left:6px}
.ritl-chip{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer;font:700 13px/1 var(--sans,"Inter",system-ui,sans-serif);letter-spacing:.3px;box-sizing:border-box;transition:border-color .15s,color .15s,background .15s}
.ritl-chip:hover{border-color:var(--brand);color:var(--accent-text)}
.ritl-chip svg{width:17px;height:17px;display:block}
.ritl-chip.q{font-size:17px;font-weight:800}
.ritl-chip.on{border-color:var(--brand);color:var(--accent-text)}
.ritl-chip:disabled{opacity:.45;cursor:default}
.ritl-tb{flex:none;display:inline-flex;margin-left:10px;line-height:0;border-radius:8px}
.ritl-tb svg{width:34px;height:34px}
.ritl-wm{flex:none;margin-left:2px;font:800 19px/1 var(--sans,"Inter",system-ui,sans-serif);letter-spacing:-.4px;color:var(--ink);text-decoration:none;white-space:nowrap}
.ritl-wm span{color:var(--accent-text)}
header[data-ritl-header] :is(button,a):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(max-width:1700px){.ritl-mid{display:none}}
@media(max-width:1080px){.ritl-wm{display:none}.ritl-in{gap:16px}}
@media(max-width:1100px){.ritl-tool .lbl{display:none}.ritl-tool>button,.ritl-tool>a{padding:0 12px}.ritl-ver{display:none}}
@media(max-width:860px){.ritl-in{height:64px;padding:0 20px;gap:12px}.ritl-eb{display:none}.ritl-icon{width:40px!important;height:40px!important}.ritl-id{gap:10px}
 .ritl-title{font-size:21px;letter-spacing:-.4px}.ritl-pill{margin-left:8px}.ritl-act,.ritl-tool,.ritl-sys{gap:6px}
 .ritl-chip,.ritl-tool>button,.ritl-tool>a{width:auto;min-width:36px;height:36px}.ritl-chip{width:36px}.ritl-wm{display:none}.ritl-tb{margin-left:4px}.ritl-tb svg{width:30px;height:30px}}
@media(max-width:620px){.ritl-in{height:auto;flex-wrap:wrap;padding:10px 16px;row-gap:10px}.ritl-id{flex:1 1 auto}.ritl-ver{display:none}
 .ritl-act{order:3;width:100%;margin-left:0;justify-content:space-between;flex-wrap:wrap;row-gap:8px}.ritl-sys{padding-left:0}.ritl-tb{margin-left:auto}}
@media(max-width:440px){.ritl-tb{display:none}.ritl-act,.ritl-tool,.ritl-sys{gap:5px}}
@media print{header[data-ritl-header]{position:static}.ritl-act{display:none}}
</style>
<script id="ritl-ui-js">
/* RITL-UI 1.0 – baut den Header aus <header data-ritl-header …> auf. Attribute:
   data-name="MUSTER" (Pflicht) · data-eyebrow="…" · data-tool="muster-ritl" · data-ver="V2.8" · data-date="16.11.2026"
   data-help="none" (ohne Anleitung) · data-lang="none" (ohne DE/EN) · data-login="URL" (Anmelden-Ziel)
   Kinder: [data-ritl-icon] (App-Bild, SVG) · [data-ritl-center] (optional, Mitte) · [data-ritl-actions] (Tool-Knöpfe, Text in <span class="lbl">)
   IDs für das Tool: #helpBtn (Anleitung, onclick setzt das Tool) · #lang-btn · #theme-btn · #ritl-auth · #ritl-edition · #ritl-chan · #ritl-ver
   Ereignisse: ritl:theme {theme} · ritl:lang {lang}. API: window.RITLUI.lang(l) · .theme(t) · .version */
(function () {
  "use strict";
  var VERSION = "1.0";
  var h = document.querySelector("header[data-ritl-header]");
  if (!h || h.classList.contains("ritl-h")) return;
  var d = h.dataset, R = window.RITL || {}, root = document.documentElement;
  var TB = "https://golfsburg.github.io/riemer-toolbox/";
  var LOGOUT_API = "https://hcluxhlvshydnncprpbl.supabase.co/functions/v1/toolbox";
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
  var I = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>',
    "in": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>',
    tb: '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="18" height="18" rx="5" fill="#C9DAF5"/><rect x="26" y="4" width="18" height="18" rx="5" fill="#8FB0E3"/><rect x="4" y="26" width="18" height="18" rx="5" fill="#8FB0E3"/><rect x="26" y="26" width="18" height="18" rx="5" fill="#1F5FC2"/><rect x="31" y="33.5" width="8" height="3" rx="1.5" fill="#FFFFFF"/><rect x="33.5" y="31" width="3" height="8" rx="1.5" fill="#FFFFFF"/></svg>'
  };
  function E(tag, attrs, html) {
    var e = document.createElement(tag);
    for (var k in attrs) if (attrs[k] != null) { if (k === "cls") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (html != null) e.innerHTML = html;
    return e;
  }
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  // ── Teile des Tools einsammeln ──
  var icon = h.querySelector("[data-ritl-icon]"), mid = h.querySelector("[data-ritl-center]"), acts = h.querySelector("[data-ritl-actions]");

  // ── Links: App-Bild · Eyebrow · NAME.ritl + Edition + DEV/BETA + Version · Datum ──
  var id = E("div", { cls: "ritl-id" });
  if (icon) { icon.classList.add("ritl-icon"); icon.setAttribute("aria-hidden", "true"); id.appendChild(icon); }
  var tt = E("div", { cls: "ritl-tt" });
  if (d.eyebrow) tt.appendChild(E("p", { cls: "ritl-eb" }, esc(d.eyebrow)));
  var vl = R.version_label || d.ver || "", vd = R.release_date || d.date || "";
  var edn = String(R.edition_name || "Standard"), std = !R.edition || R.edition === "standard";
  var ch = R.channel === "dev" || R.channel === "beta" ? R.channel : "";
  var h1 = E("h1", { cls: "ritl-title" },
    '<span class="ritl-nm notr">' + esc(d.name || document.title) + "<span>.ritl</span></span>" +
    '<b class="ritl-pill notr' + (std ? " std" : "") + '" id="ritl-edition" title="Edition ' + esc(edn) + '">' + esc(edn.toUpperCase()) + "</b>" +
    '<b class="ritl-pill notr ' + ch + '" id="ritl-chan"' + (ch ? ' title="' + (ch === "dev" ? "Entwicklungsversion" : "Beta-Version") + '"' : " hidden") + ">" + ch.toUpperCase() + "</b>" +
    '<small class="ritl-ver notr" id="ritl-ver">' + esc(vl + (vd ? " · " + vd : "")) + "</small>");
  tt.appendChild(h1); id.appendChild(tt);

  // ── Mitte (optional, z. B. Arbeitsschritte) ──
  var midBox = E("div", { cls: "ritl-mid" }); if (mid) midBox.appendChild(mid);

  // ── Rechts: Tool-Knöpfe · ? · DE/EN · Hell/Dunkel · An-/Abmelden · Toolbox-Logo · RIEMER Tools ──
  var act = E("nav", { cls: "ritl-act", "aria-label": "App-Aktionen" });
  var tool = E("div", { cls: "ritl-tool" });
  if (acts) while (acts.firstElementChild) tool.appendChild(acts.firstElementChild);
  if (tool.children.length) act.appendChild(tool);
  var sys = E("div", { cls: "ritl-sys" });
  if (d.help !== "none") sys.appendChild(E("button", { type: "button", cls: "ritl-chip q", id: "helpBtn", title: "Anleitung", "aria-label": "Anleitung" }, "?"));
  var langBtn = null;
  if (d.lang !== "none") { langBtn = E("button", { type: "button", cls: "ritl-chip notr", id: "lang-btn" }); sys.appendChild(langBtn); }
  var themeBtn = E("button", { type: "button", cls: "ritl-chip", id: "theme-btn" }); sys.appendChild(themeBtn);
  var licensed = !!(window.RITL && !R.preview);
  var auth = E("button", { type: "button", cls: "ritl-chip", id: "ritl-auth" }, licensed ? I.out : I["in"]);
  auth.title = licensed ? "Abmelden" + (R.email ? " – angemeldet als " + R.email : "") + (R.customer ? " · Lizenz: " + R.customer : "") : (R.preview ? "Admin-Vorschau – keine Anmeldung" : "Anmelden über die RIEMER Toolbox");
  auth.setAttribute("aria-label", licensed ? "Abmelden" : "Anmelden");
  if (R.preview) auth.disabled = true;
  sys.appendChild(auth);
  act.appendChild(sys);
  act.appendChild(E("a", { cls: "ritl-tb", id: "ritl-toolbox", href: TB, title: "RIEMER Toolbox – alle Tools", "aria-label": "Zur RIEMER Toolbox" }, I.tb));
  act.appendChild(E("a", { cls: "ritl-wm notr", href: "https://riemer.co", title: "riemer.co" }, "RIEMER <span>Tools</span>"));
  // Marker: der Lizenzserver fügt bei vorhandenem Kit keinen eigenen Abmelden-Knopf / kein Logo ein
  var mk = E("span", { id: "ritl-logout", hidden: "" }); act.appendChild(mk);

  var inner = E("div", { cls: "ritl-in" });
  inner.appendChild(id); inner.appendChild(midBox); inner.appendChild(act);
  while (h.firstChild) h.removeChild(h.firstChild);
  h.appendChild(inner); h.classList.add("ritl-h");

  // ── Hell/Dunkel ──
  function themeUi() { var dk = root.getAttribute("data-theme") === "dark"; themeBtn.innerHTML = dk ? I.sun : I.moon;
    themeBtn.title = dk ? "Heller Modus" : "Dunkler Modus"; themeBtn.setAttribute("aria-label", dk ? "Zu hellem Modus wechseln" : "Zu dunklem Modus wechseln"); }
  function setTheme(t) { t = t === "dark" ? "dark" : "light"; root.setAttribute("data-theme", t); LS.set("riemer-theme", t); themeUi();
    document.dispatchEvent(new CustomEvent("ritl:theme", { detail: { theme: t } })); }
  if (!root.getAttribute("data-theme")) { var t0 = LS.get("riemer-theme"); root.setAttribute("data-theme", t0 === "dark" || t0 === "light" ? t0 : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); }
  themeBtn.addEventListener("click", function () { setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });
  themeUi();

  // ── DE/EN: Chip zeigt die Zielsprache ──
  function curLang() { return (window.I18N && window.I18N.lang) || LS.get("riemer-lang") || "de"; }
  function langUi(l) { if (!langBtn) return; l = l || curLang(); var en = l === "en";
    langBtn.textContent = en ? "DE" : "EN"; langBtn.title = en ? "Deutsch" : "English"; langBtn.setAttribute("aria-label", en ? "Auf Deutsch umschalten" : "Switch to English"); }
  if (langBtn) langBtn.addEventListener("click", function () {
    var n = curLang() === "en" ? "de" : "en";
    if (typeof window.setLang === "function") window.setLang(n);
    else { LS.set("riemer-lang", n); root.setAttribute("lang", n); }
    langUi(n); document.dispatchEvent(new CustomEvent("ritl:lang", { detail: { lang: n } }));
  });
  langUi();

  // ── An-/Abmelden ──
  auth.addEventListener("click", function () {
    if (R.preview) return;
    if (!licensed) { location.href = d.login || (TB + (d.tool ? d.tool.replace(/-ritl$/, ".ritl") + "/" : "")); return; }
    if (!window.confirm("Abmelden" + (R.email ? " (" + R.email + ")" : "") + "?\n\nDer Lizenzschlüssel wird aus diesem Browser entfernt und der Geräteplatz freigegeben.")) return;
    var tool = R.tool || d.tool || "", key = LS.get("riemer-lizenz:" + tool) || LS.get("riemer-lizenz");
    var fin = false, done = function () { if (fin) return; fin = true;
      try { Object.keys(localStorage).forEach(function (k) { if (k === "riemer-lizenz" || k === "riemer-portal" || k.indexOf("riemer-lizenz:") === 0) localStorage.removeItem(k); }); } catch (e) {}
      location.reload(); };
    try { fetch(LOGOUT_API, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({ action: "logout", key: key, email: LS.get("riemer-email") || R.email || "", device: LS.get("riemer-geraet") || "", tool: tool }) }).then(done, done); } catch (e) { done(); }
    setTimeout(done, 2500);
  });

  window.RITLUI = { version: VERSION, mounted: true, lang: langUi, theme: setTheme };
})();
</script>
<!--ritl-ui:end-->
