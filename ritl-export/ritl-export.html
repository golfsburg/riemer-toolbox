<!--ritl-export:start-->
<!-- ritl-export 1.0.1 · 27.11.2026 – einheitlicher Export der RIEMER Tools: Tabellen → XLSX/PPTX, Darstellungen → PPTX, einzeln oder gesamt
     mit Auswahl-Dialog. Herausgelöst aus dem Pilot STAFF.ritl V1.0.6–V1.0.9. Nichts Tool-Spezifisches hier ändern (Block byte-gleich einbetten).
     Voraussetzung (Pflicht): JSZip 3.10.1 als window.JSZip VOR dem Block (der Baustein lädt es NICHT; fehlt es, sind alle Export-Knöpfe
     gesperrt und eine Meldung erscheint). Kein SheetJS. Standard-Klassen des Skills (.dh/.db/.df, .btn, .status, .hint).
     API (Details: README im öffentlichen Repo, Ordner ritl-export/):
       RITLEXP.init({name,version,items()→[item] (bei open/mount/one neu ausgewertet),context()→{stand,lines[]},toast(msg), optional: tool,fileTag,getSel,setSel,xlsx,download,t})
       item = {id,group,label,file?,sheet?,table?()→{cols:[{h,w,t:'d'|'n'}],rows:[[…]]},draw?(deck)→(Promise),ownPptx?(),ownXlsx?()}
       RITLEXP.open(group?) · RITLEXP.one(id,'xlsx'|'pptx') · RITLEXP.mount(host,id,label?) · RITLEXP.Deck · RITLEXP.bild(svg|canvas)
     Tasten (S-25, Baustein regelt seinen Dialog selbst): Esc schließt · Enter auf einem Knopf = dessen Klick (ohne Tastenwiederholung) ·
       Enter auf Checkbox oder ohne Knopf-Fokus löst NICHTS aus – der Dialog hat keine Eingabefelder und zwei gleichrangige Aktionen
       (XLSX/PPTX), ein Export entsteht nur bewusst per Klick bzw. Enter/Leertaste auf dem Knopf. -->
<style id="ritl-export-css">
#ritl-exp{width:min(720px,96vw)}
#ritl-exp .db:focus{outline:0}
#ritl-exp .xg{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
#ritl-exp .xg>header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-muted);font:700 12.5px var(--sans)}
#ritl-exp .xg>header span.sp{flex:1}
#ritl-exp .xr{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font:500 13px var(--sans)}
#ritl-exp .xr.h{font:600 11px var(--sans);color:var(--muted);border-top:0;padding-bottom:0}
#ritl-exp .xr input[type=checkbox]{width:18px;height:18px;margin:0}
#ritl-exp .xr .c{text-align:center}
#ritl-exp .xr small{color:var(--muted);font:500 11px var(--mono)}
#ritl-exp .xctx{margin:0 0 12px}
#ritl-exp .xzip{margin:0 0 12px;color:var(--warn,#C2410C);font-weight:600}
#ritl-exp .xa{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.ritl-expb{display:inline-flex;gap:4px;align-items:center;margin-right:6px}
.ritl-expb .btn{padding:3px 8px;min-height:0;font:600 11px var(--sans)}
@media(max-width:620px){#ritl-exp .xr{grid-template-columns:1fr 54px 54px}#ritl-exp .df .spacer{display:none}#ritl-exp .df .btn{flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px}}
@media(pointer:coarse){.ritl-expb .btn{min-height:36px;padding:6px 10px}#ritl-exp .xr input[type=checkbox]{width:22px;height:22px}}
</style>
<dialog id="ritl-exp" class="ritl-rexp" data-ritl-overlay data-ritl-baustein="ritl-export" aria-labelledby="ritl-exp-h">
 <div class="dh"><span id="ritl-exp-h">Export · Tabellen und Darstellungen</span> <small>XLSX · PPTX</small></div>
 <div class="db" tabindex="-1">
  <div class="status xctx" id="ritl-exp-ctx"></div>
  <div class="xa"><button class="btn sm" type="button" data-xa="all">Alle</button><button class="btn sm" type="button" data-xa="none">Keine</button><button class="btn sm" type="button" data-xa="xlsx">Alle Tabellen (XLSX)</button><button class="btn sm" type="button" data-xa="pptx">Alle als PPTX</button></div>
  <div id="ritl-exp-list"></div>
  <p class="hint">XLSX: alle gewählten Tabellen in <b>einer</b> Datei, je Blatt. PPTX: alle gewählten Tabellen und Darstellungen in <b>einer</b> Präsentation mit Titelfolie und Inhaltsverzeichnis. Berücksichtigt werden Stichtag und Filter, wie sie gerade eingestellt sind.</p>
 </div>
 <div class="df"><button class="btn" type="button" id="ritl-exp-close">Schließen</button><span class="spacer"></span><button class="btn" type="button" id="ritl-exp-x">XLSX</button><button class="btn primary" type="button" id="ritl-exp-p">PPTX</button></div>
</dialog>
<script>
window.RITLEXP=(function(){
"use strict";
const VERSION='1.0.1';
const C={brand:'1F5FC2',ink:'1B1F24',ink2:'2D333B',muted:'5F6773',line:'E3E6EB',line2:'CDD2D9',soft:'F4F5F7',good:'0F7B6C',warn:'C2410C',white:'FFFFFF'};
const FONT='Inter';
const W=13.333,H=7.5,MX=0.5;
const E=n=>Math.round(n*914400);
const xe=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
const hex=c=>String(c||'').replace('#','').toUpperCase();
const okHex=c=>/^[0-9A-F]{6}$/.test(hex(c));
const NS='xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"';
const pad=n=>String(n).padStart(2,'0');
const isoDe=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?`${m[3]}.${m[2]}.${m[1]}`:String(s==null?'':s)};
const fmtCell=(c,v)=>{if(v===''||v==null)return '';if(c&&c.t==='d')return isoDe(v);if(typeof v==='number')return (Math.round(v*100)/100).toLocaleString('de-AT',{maximumFractionDigits:2});return String(v)};
const tw=(s,pt)=>String(s).length*pt*0.52/72; // geschätzte Textbreite in Zoll
const fill=c=>c?`<a:solidFill><a:srgbClr val="${hex(c)}"/></a:solidFill>`:'<a:noFill/>';
const lnX=(c,w,dash)=>c?`<a:ln w="${Math.round((w||0.75)*12700)}"><a:solidFill><a:srgbClr val="${hex(c)}"/></a:solidFill>${dash?'<a:prstDash val="dash"/>':''}</a:ln>`:'<a:ln><a:noFill/></a:ln>';
function runs(str,o){ // Absätze (\n) und Läufe; o: size,bold,color,mono
 const sz=Math.round((o.size||12)*100),clr=o.color||C.ink;
 return String(str==null?'':str).split('\n').map(line=>`<a:p><a:pPr algn="${o.align==='c'?'ctr':o.align==='r'?'r':'l'}"/>${line===''?`<a:endParaRPr lang="de-AT" sz="${sz}"/>`:`<a:r><a:rPr lang="de-AT" sz="${sz}" b="${o.bold?1:0}" dirty="0">${fill(clr)}<a:latin typeface="${o.mono?'JetBrains Mono':FONT}"/></a:rPr><a:t>${xe(line)}</a:t></a:r>`}</a:p>`).join('');
}
class Slide{
 constructor(deck,o){this.deck=deck;this.sh=[];this.id=1;this.title=o.title||'';this.sub=o.sub||'';this.W=W;this.H=H;this.bx=MX;this.bw=W-2*MX;this.by=1.45;this.bh=H-1.45-0.55;this.notes=o.notes||'';this.full=!!o.full;this.media=[]}
 nid(){return ++this.id}
 rect(x,y,w,h,o={}){const id=this.nid();this.sh.push(`<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="Form ${id}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${E(x)}" y="${E(y)}"/><a:ext cx="${E(w)}" cy="${E(h)}"/></a:xfrm><a:prstGeom prst="${o.r?'roundRect':'rect'}"><a:avLst>${o.r?`<a:gd name="adj" fmla="val ${Math.round(Math.min(50000,o.r/Math.min(w,h)*100000))}"/>`:''}</a:avLst></a:prstGeom>${fill(o.fill)}${lnX(o.line,o.lw,o.dash)}</p:spPr><p:txBody><a:bodyPr/><a:lstStyle/><a:p><a:endParaRPr lang="de-AT"/></a:p></p:txBody></p:sp>`);return this}
 text(x,y,w,h,str,o={}){const id=this.nid(),ins=o.ins==null?0.05:o.ins;this.sh.push(`<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="Text ${id}"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${E(x)}" y="${E(y)}"/><a:ext cx="${E(w)}" cy="${E(h)}"/></a:xfrm><a:prstGeom prst="${o.r?'roundRect':'rect'}"><a:avLst>${o.r?`<a:gd name="adj" fmla="val ${Math.round(Math.min(50000,o.r/Math.min(w,h)*100000))}"/>`:''}</a:avLst></a:prstGeom>${fill(o.fill)}${lnX(o.line,o.lw,o.dash)}</p:spPr><p:txBody><a:bodyPr wrap="square" lIns="${E(ins)}" tIns="${E(o.tins==null?ins*0.6:o.tins)}" rIns="${E(ins)}" bIns="${E(o.tins==null?ins*0.6:o.tins)}" anchor="${o.v==='m'?'ctr':o.v==='b'?'b':'t'}"><a:noAutofit/></a:bodyPr><a:lstStyle/>${runs(str,o)}</p:txBody></p:sp>`);return this}
 line(x1,y1,x2,y2,o={}){const id=this.nid(),x=Math.min(x1,x2),y=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1),fh=x2<x1?' flipH="1"':'',fv=y2<y1?' flipV="1"':'';
  this.sh.push(`<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${id}" name="Linie ${id}"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr><p:spPr><a:xfrm${fh}${fv}><a:off x="${E(x)}" y="${E(y)}"/><a:ext cx="${E(w)}" cy="${E(h)}"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom><a:ln w="${Math.round((o.lw||1)*12700)}"><a:solidFill><a:srgbClr val="${hex(o.color||C.line2)}"/></a:solidFill>${o.dash?'<a:prstDash val="dash"/>':''}${o.arrow?'<a:tailEnd type="triangle"/>':''}</a:ln></p:spPr></p:cxnSp>`);return this}
 /** Bild (PNG/JPEG als data:-URL, z. B. aus RITLEXP.bild): o.ratio = Breite/Höhe → ins Feld einpassen und mittig setzen */
 image(x,y,w,h,src,o={}){const m=/^data:image\/(png|jpe?g);base64,(.+)$/i.exec(String(src||''));if(!m)throw new Error('Bild: nur PNG/JPEG als data:-URL');
  if(o.ratio>0){const r=w/h;if(o.ratio>r){const nh=w/o.ratio;y+=(h-nh)/2;h=nh}else{const nw=h*o.ratio;x+=(w-nw)/2;w=nw}}
  const ext=m[1].toLowerCase()==='png'?'png':'jpeg',rid='rId'+(this.media.length+2),id=this.nid();this.media.push({rid,ext,b64:m[2]});
  this.sh.push(`<p:pic><p:nvPicPr><p:cNvPr id="${id}" name="Bild ${id}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="${E(x)}" y="${E(y)}"/><a:ext cx="${E(w)}" cy="${E(h)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`);return this}
 /** Tabelle: cols [{h,w,t}], rows [[…]] – Spaltenbreiten anteilig zu w; liefert die Höhe */
 table(x,y,w,cols,rows,o={}){const id=this.nid(),pt=o.size||9,tot=cols.reduce((s,c)=>s+(c.w||14),0),cw=cols.map(c=>w*(c.w||14)/tot),lh=pt*1.25/72,padv=0.05;
  const cellLines=(c,i,v)=>{const s=fmtCell(c,v),per=Math.max(1,Math.floor((cw[i]-0.12)/(pt*0.52/72)));return s.split('\n').reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/per)),0)};
  const rh=r=>Math.max(0.26,Math.max(...r.map((v,i)=>cellLines(cols[i],i,v)))*lh+2*padv);
  const hh=Math.max(0.3,Math.max(...cols.map((c,i)=>cellLines(c,i,c.h)))*lh+2*padv+0.02);
  const tc=(txt,i,head,band)=>{const c=cols[i]||{},al=(c.t==='n'||c.t==='d')&&!head?'r':'l';return `<a:tc><a:txBody><a:bodyPr/><a:lstStyle/>${runs(head?txt:fmtCell(c,txt),{size:pt,bold:head,color:head?C.white:C.ink,align:al==='r'?'r':'l'})}</a:txBody><a:tcPr marL="${E(0.06)}" marR="${E(0.06)}" marT="${E(padv)}" marB="${E(padv)}" anchor="ctr"><a:lnL w="0"><a:noFill/></a:lnL><a:lnR w="0"><a:noFill/></a:lnR><a:lnT w="0"><a:noFill/></a:lnT><a:lnB w="6350"><a:solidFill><a:srgbClr val="${C.line}"/></a:solidFill></a:lnB>${fill(head?C.brand:band?C.soft:C.white)}</a:tcPr></a:tc>`};
  let g='<a:tblGrid>'+cw.map(v=>`<a:gridCol w="${E(v)}"/>`).join('')+'</a:tblGrid>';
  g+=`<a:tr h="${E(hh)}">`+cols.map((c,i)=>tc(c.h,i,true)).join('')+'</a:tr>';
  let th=hh;rows.forEach((r,ri)=>{const h=rh(r);th+=h;g+=`<a:tr h="${E(h)}">`+cols.map((c,i)=>tc(r[i],i,false,ri%2===1)).join('')+'</a:tr>'});
  this.sh.push(`<p:graphicFrame><p:nvGraphicFramePr><p:cNvPr id="${id}" name="Tabelle ${id}"/><p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr><p:nvPr/></p:nvGraphicFramePr><p:xfrm><a:off x="${E(x)}" y="${E(y)}"/><a:ext cx="${E(w)}" cy="${E(th)}"/></p:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table"><a:tbl><a:tblPr firstRow="1" bandRow="1"/>${g}</a:tbl></a:graphicData></a:graphic></p:graphicFrame>`);
  return th}
 /** Zeilenhöhen vorab (für Seitenumbruch) */
 static rowH(cols,rows,w,pt){const tot=cols.reduce((s,c)=>s+(c.w||14),0),cw=cols.map(c=>w*(c.w||14)/tot),lh=pt*1.25/72,padv=0.05;
  const n=(c,i,v)=>{const s=fmtCell(c,v),per=Math.max(1,Math.floor((cw[i]-0.12)/(pt*0.52/72)));return s.split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/per)),0)};
  return{head:Math.max(0.3,Math.max(...cols.map((c,i)=>n(c,i,c.h)))*lh+2*padv+0.02),rows:rows.map(r=>Math.max(0.26,Math.max(...r.map((v,i)=>n(cols[i],i,v)))*lh+2*padv))}}
 xml(n,total){const d=this.deck,m=d.meta;
  const foot=`${m.name} ${m.version} · ${m.stand}${m.lines.length?' · '+m.lines.join(' · '):''} · ${T('Quelle:')} ${m.tool}`;
  const head=[];
  if(!this.full){
   head.push(`<p:sp><p:nvSpPr><p:cNvPr id="${this.nid()}" name="Kopfband"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${E(W)}" cy="${E(0.12)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom>${fill(C.brand)}<a:ln><a:noFill/></a:ln></p:spPr><p:txBody><a:bodyPr/><a:lstStyle/><a:p><a:endParaRPr lang="de-AT"/></a:p></p:txBody></p:sp>`);
   const tid=this.nid();
   head.push(`<p:sp><p:nvSpPr><p:cNvPr id="${tid}" name="Titel"/><p:cNvSpPr><a:spLocks noGrp="1"/></p:cNvSpPr><p:nvPr><p:ph type="title"/></p:nvPr></p:nvSpPr><p:spPr><a:xfrm><a:off x="${E(MX)}" y="${E(0.35)}"/><a:ext cx="${E(W-2*MX)}" cy="${E(0.6)}"/></a:xfrm></p:spPr><p:txBody><a:bodyPr lIns="0" tIns="0" rIns="0" bIns="0" anchor="b"><a:noAutofit/></a:bodyPr><a:lstStyle/>${runs(this.title,{size:26,bold:true,color:C.ink})}</p:txBody></p:sp>`);
   if(this.sub)head.push(`<p:sp><p:nvSpPr><p:cNvPr id="${this.nid()}" name="Untertitel"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${E(MX)}" y="${E(0.98)}"/><a:ext cx="${E(W-2*MX)}" cy="${E(0.36)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="t"><a:noAutofit/></a:bodyPr><a:lstStyle/>${runs(this.sub,{size:13,color:C.muted})}</p:txBody></p:sp>`);
   head.push(`<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${this.nid()}" name="Fußlinie"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr><p:spPr><a:xfrm><a:off x="${E(MX)}" y="${E(H-0.5)}"/><a:ext cx="${E(W-2*MX)}" cy="0"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom><a:ln w="6350"><a:solidFill><a:srgbClr val="${C.line}"/></a:solidFill></a:ln></p:spPr></p:cxnSp>`);
   head.push(`<p:sp><p:nvSpPr><p:cNvPr id="${this.nid()}" name="Fußzeile"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${E(MX)}" y="${E(H-0.46)}"/><a:ext cx="${E(W-2*MX-0.9)}" cy="${E(0.36)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="ctr"><a:noAutofit/></a:bodyPr><a:lstStyle/>${runs(foot,{size:8,color:C.muted})}</p:txBody></p:sp>`);
   head.push(`<p:sp><p:nvSpPr><p:cNvPr id="${this.nid()}" name="Seitenzahl"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${E(W-MX-0.8)}" y="${E(H-0.46)}"/><a:ext cx="${E(0.8)}" cy="${E(0.36)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="ctr"><a:noAutofit/></a:bodyPr><a:lstStyle/>${runs(n+' / '+total,{size:8,color:C.muted,align:'r'})}</p:txBody></p:sp>`);
  }
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<p:sld ${NS}><p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>${head.join('')}${this.sh.join('')}</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`}
}

const $=s=>document.querySelector(s);
const T=(s,...a)=>{let x=CFG&&typeof CFG.t==='function'?(CFG.t(s)||s):s;a.forEach((v,i)=>{x=x.split('{'+i+'}').join(String(v))});return x};
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`};
const slug=s=>String(s==null?'':s).replace(/[^\wÄÖÜäöüß-]+/g,'-').replace(/^-+|-+$/g,'')||'Export';
const tag=()=>CFG.fileTag||(slug(String(CFG.name||'RITL').replace(/\.ritl$/i,''))+'-ritl');
const groups=()=>[...new Set(ITEMS.map(i=>i.group))];
const ctx=()=>{const c=(CFG.context&&CFG.context())||{};return{stand:c.stand||new Date().toLocaleDateString('de-AT'),lines:(c.lines||[]).filter(Boolean)}};
const isTab=i=>typeof i.table==='function';
const inDeck=i=>typeof i.draw==='function'||isTab(i);
const hasX=i=>isTab(i)||typeof i.ownXlsx==='function';
const toast=m=>{try{CFG.toast?CFG.toast(m):console.log(m)}catch(e){}};
function pick(ids){return ids.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean)}
function sheetsOf(items){const used=new Set(),sh=[];
 items.filter(isTab).forEach((it,k)=>{const t=it.table();let nm=(it.sheet||it.group+' '+it.label).replace(/[\\\/?*\[\]:]/g,' ').slice(0,31).trim(),b=nm,j=2;while(used.has(nm.toLowerCase()))nm=b.slice(0,28)+' '+(j++);used.add(nm.toLowerCase());
  sh.push({name:nm,cols:(t.cols||[]).map(c=>({h:c.h,w:c.w||14,t:c.t})),rows:t.rows||[],tab:k===0})});
 let inf='Export-Info',j=2;while(used.has(inf.toLowerCase()))inf='Export-Info '+(j++);
 const c=ctx();sh.push({name:inf,cols:[{h:T('Angabe'),w:22},{h:T('Wert'),w:60}],rows:[[T('Tool'),(CFG.name+' '+CFG.version).trim()],[T('Erstellt'),new Date().toLocaleString('de-AT')],[T('Stand'),c.stand]].concat(c.lines.map(l=>{const i=l.indexOf(':');return i>0?[l.slice(0,i),l.slice(i+1).trim()]:[T('Hinweis'),l]})),filter:false,wrap:true});
 return sh}
async function makeDeck(items,title){const c=ctx(),deck=new Deck({tool:CFG.tool||CFG.name,name:CFG.name,version:CFG.version,stand:c.stand,lines:c.lines,title});
 const multi=items.length>1,entries=[],off=multi?1:0; // das Inhaltsverzeichnis (Folie 2) schiebt alle Folgefolien um 1
 if(multi)deck.title();
 for(const it of items){const s0=deck.slides.length;
  if(typeof it.draw==='function')await it.draw(deck);
  else if(isTab(it)){const t=it.table();deck.tableSlides(it.group+' · '+it.label,'',t.cols,t.rows)}
  entries.push({label:it.group+' · '+it.label,page:s0+1+off})}
 if(multi){deck.tocSlide(entries);deck.slides.splice(1,0,deck.slides.pop())}
 return deck}
/* Speichern: CFG.download, sonst am Touchscreen Teilen-Blatt (S-20), sonst Download – data-noshare verhindert doppeltes Teilen mit ritl-teilen */
async function save(blob,name){
 if(typeof CFG.download==='function'){await CFG.download(blob,name);return 'ok'}
 try{if(matchMedia('(pointer:coarse)').matches&&navigator.share&&navigator.canShare&&window.File){const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
  if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return 'ok'}catch(e){if(e&&e.name==='AbortError')return 'abort'}}}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.setAttribute('data-noshare','1');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);return 'ok'}
const fertig=(r,f,was)=>toast(r==='abort'?T('Export abgebrochen.'):T('{0} gespeichert ({1}).',f,was));
async function runOwn(items,k){for(const it of items){await it[k]()}}
async function runX(ids,name){const items=pick(ids),tabs=items.filter(isTab),own=items.filter(i=>!isTab(i)&&typeof i.ownXlsx==='function');
 if(!tabs.length&&!own.length){toast(T('Keine Tabelle für XLSX gewählt.'));return}
 if(tabs.length){const f=`${stamp()}-${tag()}_${name}.xlsx`,b=typeof CFG.xlsx==='function'?await CFG.xlsx(sheetsOf(tabs)):await XL.build(sheetsOf(tabs),CFG.name);
  fertig(await save(b,f),f,tabs.length>1?T('{0} Tabellen',tabs.length):T('1 Tabelle'))}
 await runOwn(own,'ownXlsx')}
async function runP(ids,name,title){const items=pick(ids),deckI=items.filter(inDeck),own=items.filter(i=>!inDeck(i)&&typeof i.ownPptx==='function');
 if(!deckI.length&&!own.length){toast(T('Nichts für PPTX gewählt.'));return}
 if(deckI.length){const deck=await makeDeck(deckI,title||`${CFG.name} · ${name==='Gesamt'?T('Gesamt-Export'):name}`),f=`${stamp()}-${tag()}_${name}.pptx`;
  fertig(await save(await deck.blob(),f),f,T('{0} Folien',deck.slides.length))}
 await runOwn(own,'ownPptx')}
const nameFor=ids=>{const it=pick(ids),g=[...new Set(it.map(i=>i.group))];return g.length>1?'Gesamt':it.length===1?(slug(it[0].file||it[0].label)):slug(g[0])};
const LSK=()=>'ritl-export:'+tag();
let SEL={x:{},p:{}};
function loadSel(){let s={};try{s=(CFG.getSel?CFG.getSel():JSON.parse(localStorage.getItem(LSK())||'null'))||{}}catch(e){s={}}
 SEL={x:Object.assign({},s.x),p:Object.assign({},s.p)};
 if(!Object.keys(SEL.p).length&&!Object.keys(SEL.x).length){ITEMS.forEach(i=>{SEL.p[i.id]=true;if(hasX(i))SEL.x[i.id]=true})}}
function saveSel(){const v={x:SEL.x,p:SEL.p};try{CFG.setSel?CFG.setSel(v):localStorage.setItem(LSK(),JSON.stringify(v))}catch(e){}}
const art=i=>isTab(i)&&i.draw?T('Tabelle + Darstellung'):isTab(i)?T('Tabelle'):inDeck(i)?T('Darstellung'):T('eigene Datei');
function paint(){const c=ctx();$('#ritl-exp-ctx').innerHTML=(NOZIP()?`<div class="xzip" role="alert">${xe(ZIPMSG())}</div>`:'')+`<b>${xe(T('Stand:'))}</b> ${xe(c.stand)}${c.lines.length?'<br>'+c.lines.map(xe).join('<br>'):''}`;
 $('#ritl-exp-list').innerHTML=groups().map(g=>`<div class="xg"><header><span>${xe(g)}</span><span class="sp"></span><button class="btn sm" type="button" data-xg="${xe(g)}">${xe(T('Gruppe wählen'))}</button></header><div class="xr h"><span>${xe(T('Tabelle / Darstellung'))}</span><span class="c">XLSX</span><span class="c">PPTX</span></div>${ITEMS.filter(i=>i.group===g).map(i=>`<div class="xr"><span>${xe(i.label)}<br><small>${xe(art(i))}</small></span><span class="c">${hasX(i)?`<input type="checkbox" data-xs="x:${xe(i.id)}" aria-label="${xe(T('{0} als XLSX',i.label))}"${SEL.x[i.id]?' checked':''}>`:'–'}</span><span class="c"><input type="checkbox" data-xs="p:${xe(i.id)}" aria-label="${xe(T('{0} als PPTX',i.label))}"${SEL.p[i.id]?' checked':''}></span></div>`).join('')}</div>`).join('');
 cnt()}
const chosen=k=>ITEMS.filter(i=>SEL[k][i.id]&&(k==='p'||hasX(i))).map(i=>i.id);
const NOZIP=()=>!window.JSZip; // Pflicht: JSZip 3.10.1 – der Baustein lädt es nicht
const ZIPMSG=()=>T('Export nicht möglich: JSZip 3.10.1 fehlt im Tool (Baustein ritl-export lädt es nicht).');
function cnt(){const X=$('#ritl-exp-x'),P=$('#ritl-exp-p');X.textContent=`XLSX (${chosen('x').length})`;P.textContent=`PPTX (${chosen('p').length})`;X.title=T('Gewählte Tabellen als eine XLSX-Datei erstellen');P.title=T('Gewählte Tabellen und Darstellungen als eine PPTX-Präsentation erstellen');X.disabled=BUSY||NOZIP()||!chosen('x').length;P.disabled=BUSY||NOZIP()||!chosen('p').length}
/* ein Export zur Zeit: Knöpfe gesperrt (aria-busy), Doppelklick/gehaltenes Enter erzeugt keine zweite Datei */
async function guard(fn,btn){if(BUSY)return;if(NOZIP()){toast(ZIPMSG());return}BUSY=true;if(btn)btn.setAttribute('aria-busy','true');if($('#ritl-exp').open)cnt();
 try{await fn()}catch(e){toast(T('Export fehlgeschlagen: {0}',(e&&e.message)||e))}finally{BUSY=false;if(btn)btn.removeAttribute('aria-busy');if($('#ritl-exp').open)cnt()}}
function wire(){const d=$('#ritl-exp');if(d._w)return;d._w=1;
 d.addEventListener('change',e=>{const c=e.target.closest('[data-xs]');if(!c)return;const k=c.dataset.xs.slice(0,1),id=c.dataset.xs.slice(2);SEL[k][id]=c.checked;saveSel();cnt()});
 d.addEventListener('click',e=>{const a=e.target.closest('[data-xa]'),g=e.target.closest('[data-xg]');
  if(a){const m=a.dataset.xa;ITEMS.forEach(i=>{if(m==='none'){SEL.x[i.id]=false;SEL.p[i.id]=false}else if(m==='all'){SEL.p[i.id]=true;if(hasX(i))SEL.x[i.id]=true}else if(m==='xlsx'){if(hasX(i))SEL.x[i.id]=true}else if(m==='pptx')SEL.p[i.id]=true});saveSel();paint()}
  if(g){const l=ITEMS.filter(i=>i.group===g.dataset.xg),on=!l.every(i=>SEL.p[i.id]&&(!hasX(i)||SEL.x[i.id]));l.forEach(i=>{SEL.p[i.id]=on;if(hasX(i))SEL.x[i.id]=on});saveSel();paint()}});
 /* Tasten (S-25): der Baustein regelt seinen Dialog selbst (id ritl-…, data-ritl-baustein → zentraler Tool-Handler nimmt ihn aus) */
 d.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229||e.altKey)return;
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();d.close();return}
  if(e.key!=='Enter')return;
  const t=e.target;
  if(t.closest&&t.closest('button,a[href],summary')){if(e.repeat||BUSY){e.preventDefault();e.stopPropagation()}return} // Knopf: eigener Klick, nie wiederholt
  e.preventDefault();e.stopPropagation()});   // Checkbox, Fläche, Dialog selbst: kein stiller Export
 $('#ritl-exp-close').onclick=()=>d.close();
 $('#ritl-exp-x').onclick=e=>guard(()=>{const ids=chosen('x');return runX(ids,nameFor(ids))},e.currentTarget);
 $('#ritl-exp-p').onclick=e=>guard(()=>{const ids=chosen('p');return runP(ids,nameFor(ids))},e.currentTarget)}
function open(group){if(!CFG)return;refresh();loadSel();wire();if(group&&groups().includes(group)){ITEMS.forEach(i=>{const on=i.group===group;SEL.p[i.id]=on;if(hasX(i))SEL.x[i.id]=on})}paint();
 const d=$('#ritl-exp');if(!d.open)d.showModal();const b=d.querySelector('.db');if(b)b.focus({preventScroll:true})}
/** Einzelexport (kleine Knöpfe an den Panels): eigener Spezial-Export hat Vorrang, sonst Tabelle/Darstellung */
function one(id,fmt){if(CFG)refresh();const it=ITEMS.find(i=>i.id===id);if(!it)return Promise.resolve();const nm=slug(it.file||it.label);
 return guard(()=>{if(fmt==='xlsx')return typeof it.ownXlsx==='function'?it.ownXlsx():runX([id],nm);
  return typeof it.ownPptx==='function'?it.ownPptx():runP([id],nm,`${CFG.name} · ${it.group} · ${it.label}`)})}
/** Knöpfe in ein Panel setzen (host = Selektor oder Element, label = Präfix bei mehreren Einträgen im selben Panel) */
function mount(host,id,label){if(CFG)refresh();const h=typeof host==='string'?document.querySelector(host):host,it=ITEMS.find(i=>i.id===id);if(!h||!it)return;
 h.querySelectorAll('.ritl-expb').forEach(x=>{if(x.dataset.exp===id)x.remove()});
 const b=document.createElement('span');b.className='ritl-expb';b.dataset.exp=id;
 const L=label?label+' ':'',dis=NOZIP()?' disabled':'';b.innerHTML=(hasX(it)?`<button class="btn sm" type="button" data-expone="${xe(id)}" data-fmt="xlsx"${dis} title="${xe(NOZIP()?ZIPMSG():T('{0} als XLSX',it.label))}">${xe(L)}XLSX</button>`:'')+`<button class="btn sm" type="button" data-expone="${xe(id)}" data-fmt="pptx"${dis} title="${xe(NOZIP()?ZIPMSG():T('{0} als PPTX',it.label))}">${xe(L)}PPTX</button>`;
 h.insertBefore(b,h.firstChild)}
function unmount(host){const h=typeof host==='string'?document.querySelector(host):host;if(h)h.querySelectorAll('.ritl-expb').forEach(x=>x.remove())}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-expone]');if(b){e.stopPropagation();one(b.dataset.expone,b.dataset.fmt)}});
/* Einträge neu auswerten (items als Funktion: bei jedem open/mount/one – Module, Filter, Rechte können sich ändern) */
function refresh(){const v=(typeof CFG.items==='function'?CFG.items():CFG.items)||[];ITEMS=Array.isArray(v)?v:[];
 const ids=new Set();ITEMS.forEach(i=>{if(ids.has(i.id))console.warn('ritl-export: id doppelt',i.id);ids.add(i.id)})}
function init(cfg){CFG=Object.assign({name:'RIEMER Tools',version:''},cfg||{});if(CFG.version==null)CFG.version='';if(!CFG.name)CFG.name='RIEMER Tools';
 refresh();
 if(NOZIP()){console.error('ritl-export: '+ZIPMSG());const lock=()=>{if(!NOZIP())return;document.querySelectorAll('[data-expone],#ritl-exp-x,#ritl-exp-p').forEach(b=>{b.disabled=true;b.title=ZIPMSG()})};
  lock();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{lock();if(NOZIP())toast(ZIPMSG())},{once:true});else setTimeout(()=>{if(NOZIP())toast(ZIPMSG())},0)}
 return api}
const api={version:VERSION,init,open,one,mount,unmount,Deck,Slide,C,W,H,MX,fmtCell,isoDe,bild,xlsx:(sheets,title)=>XL.build(sheets,title||(CFG&&CFG.name)||'RIEMER Tools'),
 items:()=>ITEMS,groups,sheets:ids=>sheetsOf(pick(ids)),deckFor:(ids,title)=>makeDeck(pick(ids),title||'Test'),fileName:(name,ext)=>`${stamp()}-${tag()}_${slug(name)}.${ext}`,selKey:()=>LSK(),refresh:()=>{if(CFG)refresh();return ITEMS}};
return api;
})();
</script>
